<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Article Researcher: researched articles from your RapidTextAI key</title>
<meta name="description" content="Generate researched, SEO-ready articles with live web research, FAQ and sources using your RapidTextAI API key. Runs locally.">
<meta name="keywords" content="AI article generator, SEO, RapidTextAI, content research, blog writer">
<meta property="og:title" content="AI Article Researcher">
<meta property="og:description" content="Researched, SEO-ready articles from your own RapidTextAI API key.">
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f7f7f9;--fg:#1d1d1f;--mut:#6b6b76;--card:#fff;--line:#e2e2e8;--acc:#4f46e5}
  @media(prefers-color-scheme:dark){:root{--bg:#141418;--fg:#ececf1;--mut:#9a9aa8;--card:#1c1c22;--line:#2d2d36;--acc:#818cf8}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:24px;display:grid;gap:20px;grid-template-columns:340px 1fr}
  @media(max-width:860px){main{grid-template-columns:1fr}}
  h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .row{display:flex;gap:8px}.row>*{flex:1}.chk{display:flex;gap:8px;align-items:center;margin-top:8px}.chk input{width:auto}
  button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:600 15px system-ui;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}button.sec{background:transparent;color:var(--acc);border:1px solid var(--line);margin-top:8px}
  #log{font:13px ui-monospace,monospace;color:var(--mut);white-space:pre-wrap;margin-bottom:12px}
  #article{line-height:1.7}#article img{max-width:100%}.err{color:#d33}
  .bar{display:flex;gap:8px;margin-bottom:12px}.bar button{margin:0;width:auto;padding:6px 12px;font-size:13px}
</style></head><body>
<main>
  <section class="card">
    <h1>AI Article Researcher</h1>
    <p class="sub">Powered by your RapidTextAI API key.</p>
    <div id="keybox"><label for="key">RapidTextAI API key</label>
      <input id="key" type="password" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx" autocomplete="off"></div>
    <label for="topic">Topic</label><textarea id="topic" rows="2" placeholder="e.g. budget planning for small teams"></textarea>
    <label for="keyword">Primary keyword (optional)</label><input id="keyword">
    <div class="row">
      <div><label for="words">Words</label><input id="words" type="number" min="300" max="4000" value="1500"></div>
      <div><label for="type">Type</label><select id="type">
        <option>guide</option><option>how-to</option><option>listicle</option><option>comparison</option>
        <option>review</option><option>pillar</option><option>news</option></select></div>
    </div>
    <label for="tone">Tone</label><input id="tone" value="friendly, practical">
    <label for="audience">Audience (optional)</label><input id="audience">
    <label for="model">Model (optional)</label><select id="model"><option value="">Default</option></select>
    <div class="chk"><input type="checkbox" id="research" checked><label for="research" style="margin:0">Live web research</label></div>
    <div class="chk"><input type="checkbox" id="faq" checked><label for="faq" style="margin:0">Include FAQ</label></div>
    <div class="chk"><input type="checkbox" id="images"><label for="images" style="margin:0">Embed images</label></div>
    <button id="go">Generate article (6 units)</button>
  </section>
  <section class="card">
    <div class="sub" id="elapsed"></div>
    <div id="log">Fill in a topic and press Generate. Articles take 1-3 minutes.</div>
    <div class="bar" id="bar" hidden>
      <button class="sec" id="copyHtml">Copy HTML</button>
      <button class="sec" id="copyMd">Copy Markdown</button>
      <button class="sec" id="dl">Download .html</button>
    </div>
    <article id="article"></article>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null, startedAt = 0, timer = null;
const hdr = () => ({ 'Content-Type': 'application/json', ...($('key').value ? { 'X-Api-Key': $('key').value } : {}) });
$('key').value = localStorage.getItem('rtai_key') || '';
$('key').addEventListener('change', () => { localStorage.setItem('rtai_key', $('key').value); loadModels(); });

async function loadConfig() {
  const c = await (await fetch('/api/config')).json();
  if (c.hasServerKey) $('keybox').hidden = true;
  loadModels();
}
async function loadModels() {
  try {
    const r = await fetch('/api/models', { headers: hdr() });
    if (!r.ok) return;
    const data = await r.json();
    const list = (data.data || data.models || data || []).map((m) => (typeof m === 'string' ? m : m.id)).filter(Boolean);
    $('model').innerHTML = '<option value="">Default</option>' + list.map((m) => `<option>${m}</option>`).join('');
  } catch {}
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const log = (t) => { $('log').textContent = t; };
// Defensive: strip scripts, frames and inline handlers from generated HTML before rendering.
function clean(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  doc.querySelectorAll('script,iframe,object,embed,style,link,meta,form').forEach((n) => n.remove());
  doc.querySelectorAll('*').forEach((n) => [...n.attributes].forEach((a) => {
    if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
  }));
  return doc.body.innerHTML;
}

function render(a) {
  current = a;
  const faq = (a.faq || []).map((f) => `<h3>${esc(f.q)}</h3><p>${esc(f.a)}</p>`).join('');
  const src = (a.sources || []).map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></li>`).join('');
  $('article').innerHTML = `<h1>${esc(a.title)}</h1>${clean(a.body_html)}${faq ? '<h2>FAQ</h2>' + faq : ''}${src ? '<h2>Sources</h2><ul>' + src + '</ul>' : ''}`;
  $('bar').hidden = false;
  clearInterval(timer);
  log(`Done in ${Math.round((Date.now() - startedAt) / 1000)}s: ${a.word_count} words, quality ${a.quality?.score ?? 'n/a'}${(a.warnings || []).length ? '\nWarnings: ' + a.warnings.map((w) => typeof w === 'string' ? w : JSON.stringify(w)).join('; ') : ''}`);
}

$('go').onclick = async () => {
  const topic = $('topic').value.trim();
  if (!topic) return log('Enter a topic first.');
  const body = {
    topic, word_count: Number($('words').value) || 1500, article_type: $('type').value, tone: $('tone').value,
    research: $('research').checked, include_faq: $('faq').checked, include_images: $('images').checked,
  };
  for (const [k, id] of [['keyword', 'keyword'], ['audience', 'audience'], ['model', 'model']]) if ($(id).value) body[k] = $(id).value;
  $('go').disabled = true; $('bar').hidden = true; $('article').innerHTML = ''; log('Starting...');
  startedAt = Date.now(); let lines = [];
  timer = setInterval(() => { $('elapsed').textContent = Math.round((Date.now() - startedAt) / 1000) + 's elapsed'; }, 1000);
  try {
    const res = await fetch('/api/generate', { method: 'POST', headers: hdr(), body: JSON.stringify(body) });
    if (!res.ok) throw new Error((await res.json()).error?.message || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith('data:')) continue;
        const e = JSON.parse(chunk.slice(5));
        if (e.type === 'stage' && e.status === 'start') lines.push('• ' + e.stage + '...');
        else if (e.type === 'section') lines.push(`  ✓ ${e.index}/${e.of} ${e.heading}`);
        else if (e.type === 'result') render(e.data);
        else if (e.type === 'error') throw new Error(e.error.message);
        if (e.type !== 'result') log(lines.slice(-12).join('\n'));
      }
    }
  } catch (e) { $('log').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  clearInterval(timer); $('elapsed').textContent = ''; $('go').disabled = false;
};
$('copyHtml').onclick = () => navigator.clipboard.writeText(current.body_html);
$('copyMd').onclick = () => navigator.clipboard.writeText(current.body_markdown);
$('dl').onclick = () => {
  const html = `<!doctype html><meta charset="utf-8"><title>${esc(current.title)}</title><h1>${esc(current.title)}</h1>${current.body_html}`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = (current.slug || 'article') + '.html'; a.click();
};
loadConfig();
</script></body></html>
